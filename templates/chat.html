{% extends "bootstrap/base.html" %}

{% block title %}Chatbot{% endblock %}

{% block styles %}
{{ super() }}
<!-- Import Retro Pixel Font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    /* Retro Pixel Root Styles */
    body {
        background-color: #fff0f5;
        font-family: 'Press Start 2P', monospace;
        color: #5a3e4a;
        font-size: 11px;
        line-height: 1.6;
    }

    .container {
        margin-top: 30px;
        max-width: 700px;
    }

    /* Pixel Container Box */
    .pixel-box {
        background-color: #ffe4e1;
        border: 4px solid #5a3e4a;
        box-shadow: 5px 5px 0px #ffb6c1;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 0px;
    }

    /* Header & Buttons */
    .header-title {
        color: #d87093;
        font-size: 16px;
        margin: 0 0 10px 0;
        text-shadow: 2px 2px 0px #ffc0cb;
    }

    .btn-pixel-logout {
        background-color: #ff8da1;
        color: #fff;
        border: 3px solid #5a3e4a;
        box-shadow: 3px 3px 0px #5a3e4a;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 8px 12px;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.1s;
    }

    .btn-pixel-logout:hover {
        background-color: #ff6b8b;
        color: #fff;
        text-decoration: none;
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #5a3e4a;
    }

    /* Chat Window */
    #chat-box {
        height: 320px;
        background-color: #fffaf0;
        border: 4px solid #5a3e4a;
        box-shadow: inset 3px 3px 0px #ffe4e1;
        padding: 15px;
        overflow-y: scroll;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
    }

    /* Message Bubbles */
    .msg {
        max-width: 80%;
        padding: 10px;
        border: 3px solid #5a3e4a;
        word-wrap: break-word;
    }

    .bot-msg {
        background-color: #ffdae9;
        align-self: flex-start;
        box-shadow: 3px 3px 0px #ffb6c1;
    }

    .user-msg {
        background-color: #e0f4ff;
        align-self: flex-end;
        box-shadow: 3px 3px 0px #b0e0e6;
    }

    .msg-label {
        font-size: 9px;
        margin-bottom: 5px;
        display: block;
        color: #8b5a2b;
    }

    /* Inputs & Send Button */
    .pixel-input-group {
        display: flex;
        gap: 10px;
    }

    .pixel-input {
        flex: 1;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 10px;
        border: 3px solid #5a3e4a;
        background-color: #ffffff;
        color: #5a3e4a;
        outline: none;
    }

    .pixel-input:focus {
        border-color: #d87093;
        background-color: #fff0f5;
    }

    .btn-pixel-send {
        background-color: #b5ead7;
        color: #333;
        border: 3px solid #5a3e4a;
        box-shadow: 3px 3px 0px #5a3e4a;
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        padding: 10px 15px;
        cursor: pointer;
    }

    .btn-pixel-send:hover {
        background-color: #92dbbe;
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #5a3e4a;
    }

    /* Custom Pixelated Scrollbar */
    #chat-box::-webkit-scrollbar {
        width: 12px;
    }
    #chat-box::-webkit-scrollbar-track {
        background: #ffe4e1;
        border-left: 3px solid #5a3e4a;
    }
    #chat-box::-webkit-scrollbar-thumb {
        background: #ff8da1;
        border: 2px solid #5a3e4a;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="pixel-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h1 class="header-title">Welcome, {{ name }}!</h1>
            <a href="{{ url_for('logout') }}" class="btn-pixel-logout">LOGOUT</a>
        </div>
        <p><strong>EMAIL:</strong> {{ email }}</p>
    </div>

    <div class="pixel-box">
        <div id="chat-box">
            <div class="msg bot-msg">
                <span class="msg-label">🤖 BOT</span>
                Hello {{ name }}! Say "My name is [Name]" or ask "What is my name?".
            </div>
        </div>

        <div class="pixel-input-group">
            <input type="text" id="user-input" class="pixel-input" placeholder="TYPE MESSAGE..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="btn-pixel-send" onclick="sendMessage()">SEND</button>
        </div>
    </div>
</div>

<script>
async function sendMessage() {
    const inputField = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const text = inputField.value.trim();

    if (!text) return;

    // Display user message bubble
    chatBox.innerHTML += `
        <div class="msg user-msg">
            <span class="msg-label">👾 YOU</span>
            ${escapeHtml(text)}
        </div>
    `;
    inputField.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Send POST request to /chat endpoint
    try {
        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        const data = await response.json();

        // Display bot response bubble
        chatBox.innerHTML += `
            <div class="msg bot-msg">
                <span class="msg-label">🤖 BOT</span>
                ${escapeHtml(data.reply)}
            </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (err) {
        chatBox.innerHTML += `
            <div class="msg bot-msg" style="background-color: #ffb7b2;">
                <span class="msg-label">⚠️ ERROR</span>
                Could not reach chatbot.
            </div>
        `;
    }
}

// Helper to escape HTML characters
function escapeHtml(string) {
    return String(string).replace(/[&<>"']/g, function (s) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[s];
    });
}
</script>
{% endblock %}
